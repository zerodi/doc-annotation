<tui-root>
  <header>
    <tui-app-bar>
      <button
        iconStart="@tui.zoom-in"
        tuiIconButton
        tuiSlot="right"
        type="button"
        (click)="zoom.zoomIn()"
      >
        Zoom In
      </button>
      <button
        iconStart="@tui.zoom-out"
        tuiIconButton
        tuiSlot="right"
        type="button"
        (click)="zoom.zoomOut()"
      >
        Zoom Out
      </button>
      <button
        tuiButton
        tuiSlot="right"
        type="button"
        (click)="save.emit()"
      >
        Save
      </button>
    </tui-app-bar>
  </header>
  <div class="wrapper">
    <router-outlet />
  </div>
</tui-root>
